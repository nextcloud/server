services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - backend

  app:
    image: nextcloud:apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?Set NEXTCLOUD_ADMIN_PASSWORD in .env}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost localhost:8080 127.0.0.1 127.0.0.1:8080
      TRUSTED_PROXIES: 172.30.0.0/24
      OVERWRITEHOST: localhost:8080
      OVERWRITEPROTOCOL: http
      APACHE_DISABLE_REWRITE_IP: "1"
    volumes:
      - nextcloud_html:/var/www/html
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$$status = json_decode(file_get_contents("http://127.0.0.1/status.php"), true);
          exit(($$status["installed"] ?? false) ? 0 : 1);'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - frontend
      - backend

  load-balancer:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - frontend

volumes:
  postgres_data:
  nextcloud_html:

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
