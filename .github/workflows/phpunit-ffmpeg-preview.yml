name: PHPUnit ffmpeg preview service

on:
  workflow_call:

permissions:
  contents: read

jobs:
  phpunit-ffmpeg-preview:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ["8.3", "8.5"]

    name: ffmpeg preview service (PHP ${{ matrix.php-versions }})

    steps:
      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Build and start ffmpeg preview service
        run: |
          docker build -t ffmpeg-preview-service build/ffmpeg-preview-service
          docker run -d --name ffmpeg-preview -p 8080:8080 -e API_KEY=ci-secret ffmpeg-preview-service
          timeout 30 sh -c 'until curl -sf http://127.0.0.1:8080/health; do sleep 1; done'

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        timeout-minutes: 5
        with:
          php-version: ${{ matrix.php-versions }}
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, imagick, intl, json, libxml, mbstring, openssl, pcntl, pdo_sqlite, posix, session, simplexml, sqlite, xmlreader, xmlwriter, zip, zlib
          coverage: none
          ini-file: development
          ini-values: disable_functions=""
        env:
          fail-fast: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up dependencies
        run: composer i

      - name: Set up Nextcloud
        run: |
          mkdir data
          cp tests/preseed-config.php config/config.php
          ./occ maintenance:install --verbose --database=sqlite --database-name=nextcloud --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass admin
          NC_debug=true ./occ testing:prepare-ci
          php -f tests/enable_all.php

      - name: PHPUnit ffmpeg preview service tests
        env:
          FFMPEG_PREVIEW_URL: http://127.0.0.1:8080
          FFMPEG_PREVIEW_KEY: ci-secret
        run: composer run test -- --group FFmpegPreviewService --fail-on-skipped --log-junit junit.xml

      - name: Print logs
        if: always()
        run: |
          cat data/nextcloud.log
          docker logs ffmpeg-preview
