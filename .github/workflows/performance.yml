name: Performance testing
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  performance-testing:
    runs-on: ubuntu-latest

    # Skip entirely on fork PRs so the job result is 'skipped' rather than
    # 'failure'. The profiler action uses github.event.pull_request.head.repo.clone_url
    # and GITHUB_TOKEN in ways that do not work reliably from forks, and a
    # clean skip is far less confusing for contributors than a mid-run error.
    if: >-
      github.repository_owner != 'nextcloud-gmbh' &&
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      pull-requests: write

    name: performance

    steps:

      - name: Checkout server before PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Set up php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        timeout-minutes: 5
        with:
          php-version: '8.3'
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, redis, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Nextcloud
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=sqlite --database-name=nextcloud --database-host=127.0.0.1 --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass password

          php -S localhost:8080 &
      - name: Apply blueprint
        uses: icewind1991/blueprint@00504403f76cb2a09efd0d16793575055e6f63cb # v0.1.2
        with:
          blueprint: tests/blueprints/basic.toml
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Seed users with emails
        run: |
          ./occ config:system:set auth.bruteforce.protection.enabled --value false --type boolean
          sqlite3 data/nextcloud.db <<'SQL'
          WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 100000)
          INSERT INTO oc_users (uid, displayname, password, uid_lower) SELECT 'seed' || i, 'Seed ' || i, '', 'seed' || i FROM n;
          WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 100000)
          INSERT INTO oc_preferences (userid, appid, configkey, configvalue, lazy, type, flags, indexed)
          SELECT 'seed' || i, 'settings', 'email', 'seed' || i || '@example.com', 0, 2, 2, 'seed' || i || '@example.com' FROM n;
          ANALYZE;
          SQL

      - name: Run before measurements
        uses: nextcloud/profiler@6a74c915048285b35b8e1cd96c0835a635945044
        with:
          run: |
            curl -s -X PROPFIND -u test:test http://localhost:8080/remote.php/dav/files/test
            curl -s -u test:test http://localhost:8080/remote.php/dav/files/test/test.txt
            curl -s -X PROPFIND -u test:test http://localhost:8080/remote.php/dav/files/test/many_files
            curl -s -u test:test -T README.md http://localhost:8080/remote.php/dav/files/test/new_file.txt
            curl -s -u test:test -X DELETE http://localhost:8080/remote.php/dav/files/test/new_file.txt
            for run in 1 2 3; do
              curl -s -X PROPFIND -u nobody@example.com:wrong http://localhost:8080/remote.php/dav/
              curl -s -u test:test -X REPORT -H 'Depth: 0' -H 'Content-Type: application/xml' http://localhost:8080/remote.php/dav/principals/users/ --data '<d:principal-property-search xmlns:d="DAV:" xmlns:s="http://sabredav.org/ns"><d:property-search><d:prop><s:email-address/></d:prop><d:match>seed99999@example.com</d:match></d:property-search><d:prop><d:displayname/></d:prop></d:principal-property-search>'
            done
          output: before.json
          profiler-branch: master

      - name: Apply PR # zizmor: ignore[template-injection]
        run: |
          git remote add pr '${{ github.event.pull_request.head.repo.clone_url }}'
          git fetch pr '${{ github.event.pull_request.head.ref }}'
          git checkout -b 'pr/${{ github.event.pull_request.head.ref }}'
          git submodule update

          ./occ upgrade

      - name: Run after measurements
        id: compare
        uses: nextcloud/profiler@6a74c915048285b35b8e1cd96c0835a635945044
        with:
          run: |
            curl -s -X PROPFIND -u test:test http://localhost:8080/remote.php/dav/files/test
            curl -s -u test:test http://localhost:8080/remote.php/dav/files/test/test.txt
            curl -s -X PROPFIND -u test:test http://localhost:8080/remote.php/dav/files/test/many_files
            curl -s -u test:test -T README.md http://localhost:8080/remote.php/dav/files/test/new_file.txt
            curl -s -u test:test -X DELETE http://localhost:8080/remote.php/dav/files/test/new_file.txt
            for run in 1 2 3; do
              curl -s -X PROPFIND -u nobody@example.com:wrong http://localhost:8080/remote.php/dav/
              curl -s -u test:test -X REPORT -H 'Depth: 0' -H 'Content-Type: application/xml' http://localhost:8080/remote.php/dav/principals/users/ --data '<d:principal-property-search xmlns:d="DAV:" xmlns:s="http://sabredav.org/ns"><d:property-search><d:prop><s:email-address/></d:prop><d:match>seed99999@example.com</d:match></d:property-search><d:prop><d:displayname/></d:prop></d:principal-property-search>'
            done
          output: after.json
          profiler-branch: master
          compare-with: before.json

      - name: Compare DB time
        id: dbtime
        # Advisory until runner noise is measured
        continue-on-error: true
        run: |
          jq -rn --slurpfile b before.json --slurpfile a after.json '
            def t: group_by(.method + " " + .url) | map({key: (.[0].method + " " + .[0].url), value: (map([.collectors.db.queries[].executionMS] | add * 1000) | min)}) | from_entries;
            ($b[0] | t) as $B | ($a[0] | t) as $A
            | $A | to_entries[] | select($B[.key] != null and .value > 2 * $B[.key] and .value - $B[.key] > 5)
            | "\(.key): DB time \($B[.key] * 100 | round / 100) ms -> \(.value * 100 | round / 100) ms"' | tee db-regressions.txt
          test ! -s db-regressions.txt

      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: profiles
          path: |
            before.json
            after.json

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: always() && (steps.compare.outcome == 'failure' || steps.dbtime.outcome == 'failure')
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            let comment = `Possible performance regression detected\n`;
            comment += `<details><summary>Show Output</summary>

            \`\`\`
            ${{ steps.compare.outputs.compare }}
            \`\`\`

            DB time:
            \`\`\`
            ${{ steps.dbtime.outcome == 'failure' && 'see db-regressions.txt in the job log' || 'unchanged' }}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            })
